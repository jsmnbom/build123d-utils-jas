[project]
name = "build123d-utils-jas"
version = "0.2.0"
description = "Personal build123d utilities: fast Shape patching, vendor STEP import caching, assembly helpers, viewer wrappers, FDM design helpers (holes, fastener pockets, fits)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jasmin Bom", email = "jsmnbom@gmail.com" }]
keywords = ["build123d", "cad", "3d-printing", "ocp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "build123d>=0.13.0",
  "numpy>=2",
  "scipy>=1.14",
]

[project.urls]
Homepage = "https://github.com/jsmnbom/build123d-utils-jas"
Repository = "https://github.com/jsmnbom/build123d-utils-jas"
Issues = "https://github.com/jsmnbom/build123d-utils-jas/issues"

[project.optional-dependencies]
fasteners = ["bd_warehouse>=0.4"]
preview = ["ocp-vscode>=4"]
dev = ["pytest>=8", "ruff>=0.15.16", "cadquery-ocp-stubs>=8.0,<8.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build123d_utils_jas"]

[tool.hatch.build.targets.sdist]
include = ["src/build123d_utils_jas", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
indent-width = 2

# Develop/test against build123d dev (where the ecosystem is heading);
# the published package only requires >=0.13.0.
[tool.uv.sources]
build123d = { git = "https://github.com/gumyr/build123d", rev = "092c40e387e2ed925ff989faeb8bf7a4009524e7" }
