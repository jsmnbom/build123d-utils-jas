name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build123d:
          - "build123d==0.13.0"
          - "build123d @ git+https://github.com/gumyr/build123d@092c40e387e2ed925ff989faeb8bf7a4009524e7"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install package and test deps
        run: |
          uv venv
          uv pip install --no-sources -e '.[fasteners]' pytest '${{ matrix.build123d }}'

      - name: Run tests
        run: uv run --no-sync pytest -q
